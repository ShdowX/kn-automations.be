<svg width="1200" height="627" viewBox="0 0 1200 627" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI amplifies the process you already have</title>
  <desc id="desc">Dark KN Automations-style visual showing a broken process becoming faster chaos when AI is added, versus redesigned work becoming a cleaner operating model.</desc>
  <rect width="1200" height="627" fill="#050510"/>
  <defs>
    <radialGradient id="blobA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(245 96) rotate(54) scale(350 210)">
      <stop stop-color="#7DD3FC" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1006 474) rotate(140) scale(440 260)">
      <stop stop-color="#C4B5FD" stop-opacity="0.54"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="146" y1="135" x2="1049" y2="523" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F8FC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F6F8FC" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1200" height="627" fill="url(#blobA)"/>
  <rect width="1200" height="627" fill="url(#blobB)"/>
  <g opacity="0.22">
    <path d="M0 97H1200" stroke="#FAFAF7" stroke-opacity="0.11"/>
    <path d="M0 203H1200" stroke="#FAFAF7" stroke-opacity="0.08"/>
    <path d="M0 309H1200" stroke="#FAFAF7" stroke-opacity="0.08"/>
    <path d="M0 415H1200" stroke="#FAFAF7" stroke-opacity="0.08"/>
    <path d="M0 521H1200" stroke="#FAFAF7" stroke-opacity="0.08"/>
    <path d="M155 0V627" stroke="#FAFAF7" stroke-opacity="0.08"/>
    <path d="M445 0V627" stroke="#FAFAF7" stroke-opacity="0.08"/>
    <path d="M755 0V627" stroke="#FAFAF7" stroke-opacity="0.08"/>
    <path d="M1045 0V627" stroke="#FAFAF7" stroke-opacity="0.08"/>
  </g>
  <text x="72" y="82" fill="#7DD3FC" font-family="JetBrains Mono, Fira Code, monospace" font-size="18" letter-spacing="2">PROCESS FIELD NOTE</text>
  <text x="72" y="141" fill="#FAFAF7" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="300">AI amplifies</text>
  <text x="72" y="198" fill="#FAFAF7" font-family="Fraunces, Georgia, serif" font-size="54" font-weight="300">what already exists.</text>
  <g filter="url(#softShadow)">
    <rect x="70" y="260" width="500" height="250" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
    <rect x="630" y="260" width="500" height="250" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.22"/>
  </g>
  <text x="105" y="313" fill="#FFB86B" font-family="JetBrains Mono, Fira Code, monospace" font-size="17" letter-spacing="1.5">BROKEN PROCESS + AI</text>
  <text x="665" y="313" fill="#7DD3FC" font-family="JetBrains Mono, Fira Code, monospace" font-size="17" letter-spacing="1.5">REDESIGNED WORK + AI</text>
  <g stroke="#FAFAF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 382C166 338 197 434 242 391C289 347 321 439 367 394C405 357 439 411 485 370" stroke="#FFB86B"/>
    <path d="M120 430C164 413 196 438 241 422C287 405 321 438 366 420C409 403 440 425 485 407" stroke="#FAFAF7" stroke-opacity="0.32"/>
    <path d="M685 418H755" stroke="#7DD3FC"/>
