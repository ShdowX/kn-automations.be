    <path d="M905 418H975" stroke="#7DD3FC"/>
    <path d="M745 418L757 406M745 418L757 430" stroke="#7DD3FC"/>
    <path d="M855 418L867 406M855 418L867 430" stroke="#7DD3FC"/>
    <path d="M965 418L977 406M965 418L977 430" stroke="#7DD3FC"/>
  </g>
  <g>
    <rect x="112" y="350" width="70" height="44" rx="14" fill="#FAFAF7" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="245" y="382" width="70" height="44" rx="14" fill="#FAFAF7" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="392" y="342" width="70" height="44" rx="14" fill="#FAFAF7" fill-opacity="0.09" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <rect x="682" y="368" width="76" height="76" rx="20" fill="#FAFAF7" fill-opacity="0.09" stroke="#7DD3FC" stroke-opacity="0.42"/>
    <rect x="792" y="368" width="76" height="76" rx="20" fill="#FAFAF7" fill-opacity="0.09" stroke="#7DD3FC" stroke-opacity="0.42"/>
    <rect x="902" y="368" width="76" height="76" rx="20" fill="#FAFAF7" fill-opacity="0.09" stroke="#7DD3FC" stroke-opacity="0.42"/>
  </g>
  <text x="105" y="472" fill="#FAFAF7" fill-opacity="0.72" font-family="Inter Tight, system-ui, sans-serif" font-size="24">Faster chaos.</text>
  <text x="665" y="472" fill="#FAFAF7" fill-opacity="0.72" font-family="Inter Tight, system-ui, sans-serif" font-size="24">Cleaner operating model.</text>
  <text x="72" y="576" fill="#FAFAF7" fill-opacity="0.48" font-family="JetBrains Mono, Fira Code, monospace" font-size="15" letter-spacing="1">START WITH THE PROCESS. THEN CHOOSE THE TOOL.</text>
