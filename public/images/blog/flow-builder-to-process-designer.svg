<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" role="img" aria-labelledby="title desc">
  <title id="title">From flow builder to process designer</title>
  <desc id="desc">A light process diagram showing a shift from individual automation steps to an end-to-end process design view.</desc>
  <rect width="1200" height="627" fill="#f7fbff"/>
  <circle cx="1040" cy="80" r="230" fill="#e5f1ff"/>
  <circle cx="110" cy="540" r="190" fill="#edf6ff"/>
  <text x="78" y="86" fill="#004f9e" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700">From flow builder to process designer</text>
  <text x="80" y="124" fill="#253858" font-family="Inter, Arial, sans-serif" font-size="21">Do not automate the step. Understand the work.</text>

  <g transform="translate(82 194)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="318" height="244" rx="30" fill="#ffffff" stroke="#c8dcf3" stroke-width="3"/>
    <text x="34" y="54" fill="#004f9e" font-size="28" font-weight="700">Flow builder</text>
    <rect x="38" y="86" width="76" height="52" rx="18" fill="#e7f1ff"/>
    <rect x="132" y="86" width="76" height="52" rx="18" fill="#e7f1ff"/>
    <rect x="226" y="86" width="52" height="52" rx="18" fill="#e7f1ff"/>
    <path d="M114 112h18M208 112h18" stroke="#004f9e" stroke-width="5" stroke-linecap="round"/>
    <text x="38" y="178" fill="#253858" font-size="19">Trigger</text>
    <text x="132" y="178" fill="#253858" font-size="19">Action</text>
    <text x="226" y="178" fill="#253858" font-size="19">Task</text>
  </g>

  <path d="M432 314h90" stroke="#004f9e" stroke-width="7" stroke-linecap="round"/>
  <path d="M506 292l26 22-26 22" fill="none" stroke="#004f9e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(558 164)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="0" width="558" height="304" rx="34" fill="#ffffff" stroke="#9fc4ef" stroke-width="3"/>
    <text x="38" y="58" fill="#004f9e" font-size="30" font-weight="700">Process designer</text>
    <path d="M70 160 C150 80, 250 238, 338 150 S466 122, 500 186" fill="none" stroke="#004f9e" stroke-width="7" stroke-linecap="round"/>
    <g fill="#ffffff" stroke="#004f9e" stroke-width="5">
      <circle cx="72" cy="160" r="25"/>
      <circle cx="208" cy="150" r="25"/>
      <circle cx="338" cy="150" r="25"/>
      <circle cx="500" cy="186" r="25"/>
    </g>
    <g fill="#253858" font-size="18">
      <text x="40" y="232">Owner</text>
      <text x="170" y="232">Data</text>
      <text x="292" y="232">Exception</text>
      <text x="456" y="232">Support</text>
    </g>
  </g>

  <text x="82" y="532" fill="#6b7a90" font-family="Inter, Arial, sans-serif" font-size="18">A flow solves a step.</text>
  <text x="558" y="532" fill="#6b7a90" font-family="Inter, Arial, sans-serif" font-size="18">A process design improves how work happens.</text>
</svg>
